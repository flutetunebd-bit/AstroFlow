backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/assets/images"
public_folder: "/assets/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/content/config.ts" # আপনার থিমের কন্টেন্ট ফাইল অনুযায়ী এটি পরে চেঞ্জ করা যাবে
        label: "Home Page"
        name: "home"
        fields:
          - { label: "Hero Title", name: "title", widget: "string" }
          - { label: "Hero Subtitle", name: "subtitle", widget: "text" }
          - { label: "Banner Image", name: "image", widget: "image" }
